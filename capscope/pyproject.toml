[project]
name = "capscope"
version = "0.1.0"
description = "Local pcap/pcapng analyzer for mobile-network and IoT troubleshooting (TShark + FastAPI + SQLite)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "psutil>=5.9"]

[project.scripts]
capscope = "capscope.__main__:main"

[tool.setuptools]
packages = ["capscope", "capscope.analyzers"]

[tool.setuptools.package-data]
capscope = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
